name: Publish Judge0 image to ECR

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/publish-ecr.yml
      - Dockerfile
      - Gemfile
      - Gemfile.lock
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable ECR image tag (update the IAC image_tag before deploying it)
        required: true
        default: 1.13.1-z21.1

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ecr-${{ inputs.image_tag || '1.13.1-z21.1' }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/dev' }}
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_ECR_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/judge0-dev:${{ inputs.image_tag || '1.13.1-z21.1' }}
